# Serves the built SPA and reverse-proxies /api to the api service, so the
# browser only ever talks to one origin: no CORS, and no backend URL baked into
# the bundle at build time.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Gzip compression for high-performance server delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The shell must never be cached, or a redeploy keeps serving stale asset
    # references from a previous build.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # `^~` takes precedence over the regex location below, so API paths can
    # never be mistaken for static assets.
    location ^~ /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Client-side routing: any unknown path falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
